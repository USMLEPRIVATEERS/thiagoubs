<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>UBS Saude</title>
  <script>
    // SPA fallback for GitHub Pages
    // When a dynamic route 404s, store the path and redirect to root
    // The app's layout script will restore the correct URL via client-side routing
    sessionStorage.setItem('spa-redirect', location.pathname + location.search + location.hash);
    location.replace('/thiagoubs/');
  </script>
</head>
<body>
  <p>Redirecionando...</p>
</body>
</html>
